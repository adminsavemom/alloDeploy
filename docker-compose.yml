version: '3.8'

services:
  allodeploy:
    build:
      context: .
      dockerfile: Dockerfile
    image: allodeploy:latest
    container_name: allodeploy-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      # - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      # - SUPABASE_URL=${SUPABASE_URL:-}
      # - SUPABASE_KEY=${SUPABASE_KEY:-}
    volumes:
      - allodeploy_storage:/app/backend/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  allodeploy_storage:
    driver: local
