<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlloDeploy · Modern Developer Hosting & Instant Drag & Drop Deployment</title>
    <meta name="description" content="Deploy web services and static sites instantly with manual drag and drop, live streaming build logs, and global edge CDN." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><path d='M16 6L24 13L16 20L8 13L16 6Z' fill='white'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-container"></div>
    <div id="backend-container"></div>
    <div id="preview-container"></div>
    <div id="toast-container"></div>
    <div id="drag-overlay" class="global-drag-overlay" style="display: none;">
      <div class="global-drag-content">
        <div style="width: 64px; height: 64px; border-radius: 12px; background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.35); display: flex; align-items: center; justify-content: center; color: #818cf8;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
        </div>
        <div>
          <h2 style="font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px;">
            Drop files to deploy
          </h2>
          <p style="font-size: 14px; color: #94a3b8; max-width: 500px; margin: 0 auto;">
            Release your .ZIP archive, build directory (dist/), or static HTML/JS files to upload.
          </p>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px;">
          <span style="background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.25); color: #a5b4fc; font-size: 11.5px; padding: 3px 8px; border-radius: 4px; font-family: var(--font-mono);">.ZIP / .TAR</span>
          <span style="background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.25); color: #38bdf8; font-size: 11.5px; padding: 3px 8px; border-radius: 4px; font-family: var(--font-mono);">dist/ & build/</span>
          <span style="background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25); color: #34d399; font-size: 11.5px; padding: 3px 8px; border-radius: 4px; font-family: var(--font-mono);">HTML & Static</span>
          <span style="background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); color: #fbbf24; font-size: 11.5px; padding: 3px 8px; border-radius: 4px; font-family: var(--font-mono);">Node.js</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
