<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlloDeploy · Modern Developer Hosting & Instant Drag & Drop Deployment</title>
    <meta name="description" content="Deploy web services and static sites instantly with manual drag and drop, live streaming build logs, and global edge CDN." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><path d='M16 6L24 13L16 20L8 13L16 6Z' fill='white'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-container"></div>
    <div id="backend-container"></div>
    <div id="preview-container"></div>
    <div id="toast-container"></div>
    <div id="drag-overlay" class="global-drag-overlay" style="display: none;">
      <div class="global-drag-content">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: rgba(99, 102, 241, 0.2); border: 2px solid #6366f1; display: flex; align-items: center; justify-content: center; color: #818cf8; font-size: 36px; box-shadow: 0 0 40px rgba(99, 102, 241, 0.4);">
          📦
        </div>
        <div>
          <h2 style="font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px;">
            Drop to Deploy to AlloDeploy
          </h2>
          <p style="font-size: 15px; color: #94a3b8; max-width: 520px;">
            Release your <strong>.ZIP archive</strong>, <strong>build folder (dist/)</strong>, or <strong>HTML/JS/CSS files</strong> to inspect and launch globally.
          </p>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px;">
          <span style="background: rgba(99,102,241,0.2); border: 1px solid rgba(99,102,241,0.4); color: #a5b4fc; font-size: 12px; padding: 4px 10px; border-radius: 9999px;">.ZIP & .TAR</span>
          <span style="background: rgba(6,182,212,0.2); border: 1px solid rgba(6,182,212,0.4); color: #38bdf8; font-size: 12px; padding: 4px 10px; border-radius: 9999px;">dist/ & build/</span>
          <span style="background: rgba(16,185,129,0.2); border: 1px solid rgba(16,185,129,0.4); color: #34d399; font-size: 12px; padding: 4px 10px; border-radius: 9999px;">HTML5 & JavaScript</span>
          <span style="background: rgba(245,158,11,0.2); border: 1px solid rgba(245,158,11,0.4); color: #fbbf24; font-size: 12px; padding: 4px 10px; border-radius: 9999px;">Node.js APIs</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
